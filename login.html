<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar | Oficina Bandeira</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
    * { font-family: 'Poppins', sans-serif; }
    body { background: #0f172a; min-height: 100vh; display: flex; align-items: center; }
    .auth-card {
      background: #1e293b;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 440px;
      margin: auto;
    }
    .form-control, .form-select {
      background: #0f172a;
      border: 1px solid rgba(255,255,255,0.1);
      color: #e2e8f0;
      border-radius: 8px;
    }
    .form-control:focus, .form-select:focus {
      background: #0f172a;
      border-color: #dc3545;
      color: #e2e8f0;
      box-shadow: 0 0 0 3px rgba(220,53,69,0.15);
    }
    .form-label { color: #94a3b8; font-size: .875rem; }
    .tab-btn {
      background: none;
      border: none;
      color: #64748b;
      font-weight: 600;
      font-size: 1rem;
      padding: 8px 20px;
      border-bottom: 2px solid transparent;
      transition: all .2s;
    }
    .tab-btn.active { color: #dc3545; border-bottom-color: #dc3545; }
    .alert-dark-danger { background: rgba(220,53,69,.15); border: 1px solid rgba(220,53,69,.3); color: #fca5a5; border-radius: 8px; }
    .alert-dark-success { background: rgba(34,197,94,.12); border: 1px solid rgba(34,197,94,.3); color: #86efac; border-radius: 8px; }
  </style>
</head>
<body>
<div class="container px-3">
  <div class="auth-card">
    <!-- Logo -->
    <div class="text-center mb-4">
      <a href="index.html" class="text-decoration-none">
        <i class="bi bi-tools text-danger fs-2"></i>
        <div class="fw-bold text-white mt-1">OFICINA BANDEIRA</div>
      </a>
    </div>

    <!-- Tabs -->
    <div class="d-flex border-bottom border-secondary mb-4">
      <button class="tab-btn active" id="tabLogin" onclick="mostrarTab('login')">Entrar</button>
      <button class="tab-btn" id="tabCadastro" onclick="mostrarTab('cadastro')">Criar Conta</button>
    </div>

    <!-- Alerta -->
    <div id="alerta" class="d-none p-3 mb-3 small"></div>

    <!-- LOGIN -->
    <form id="formLogin" onsubmit="fazerLogin(event)">
      <div class="mb-3">
        <label class="form-label">E-mail</label>
        <input type="email" id="loginEmail" class="form-control" placeholder="seu@email.com" required>
      </div>
      <div class="mb-4">
        <label class="form-label">Senha</label>
        <input type="password" id="loginSenha" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-danger w-100 fw-bold" id="btnLogin">
        <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
      </button>
    </form>

    <!-- CADASTRO -->
    <form id="formCadastro" class="d-none" onsubmit="fazerCadastro(event)">
      <div class="mb-3">
        <label class="form-label">Nome completo</label>
        <input type="text" id="cadNome" class="form-control" placeholder="Seu nome" required>
      </div>
      <div class="mb-3">
        <label class="form-label">E-mail</label>
        <input type="email" id="cadEmail" class="form-control" placeholder="seu@email.com" required>
      </div>
      <div class="mb-1">
        <label class="form-label">Senha</label>
        <input type="password" id="cadSenha" class="form-control" placeholder="Mín. 8 caracteres" required>
      </div>
      <p class="small mb-4" style="color:#475569">Deve conter ao menos 8 caracteres, 1 maiúscula e 1 número.</p>
      <button type="submit" class="btn btn-danger w-100 fw-bold" id="btnCadastro">
        <i class="bi bi-person-plus me-2"></i>Criar Conta
      </button>
    </form>

    <p class="text-center mt-4 mb-0 small" style="color:#475569">
      <a href="index.html" class="text-danger text-decoration-none"><i class="bi bi-arrow-left me-1"></i>Voltar ao site</a>
    </p>
  </div>
</div>

<script>
const API = 'http://localhost:3001/api';

function mostrarTab(tab) {
  document.getElementById('formLogin').classList.toggle('d-none', tab !== 'login');
  document.getElementById('formCadastro').classList.toggle('d-none', tab !== 'cadastro');
  document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
  document.getElementById('tabCadastro').classList.toggle('active', tab === 'cadastro');
  esconderAlerta();
}

function mostrarAlerta(msg, tipo = 'erro') {
  const el = document.getElementById('alerta');
  el.className = `p-3 mb-3 small ${tipo === 'erro' ? 'alert-dark-danger' : 'alert-dark-success'}`;
  el.textContent = msg;
}
function esconderAlerta() {
  document.getElementById('alerta').className = 'd-none';
}

async function fazerLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('btnLogin');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Entrando...';

  try {
    const res = await fetch(`${API}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('loginEmail').value,
        senha: document.getElementById('loginSenha').value
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.erro || 'Erro ao entrar.');
    localStorage.setItem('ob_token', data.token);
    localStorage.setItem('ob_usuario', JSON.stringify(data.usuario));
    window.location.href = 'dashboard.html';
  } catch (err) {
    mostrarAlerta(err.message);
    btn.disabled = false;
    btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Entrar';
  }
}

async function fazerCadastro(e) {
  e.preventDefault();
  const btn = document.getElementById('btnCadastro');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Criando conta...';

  try {
    const res = await fetch(`${API}/auth/cadastro`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        nome:  document.getElementById('cadNome').value,
        email: document.getElementById('cadEmail').value,
        senha: document.getElementById('cadSenha').value
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error((data.erros || [data.erro]).join(' '));
    localStorage.setItem('ob_token', data.token);
    localStorage.setItem('ob_usuario', JSON.stringify(data.usuario));
    window.location.href = 'dashboard.html';
  } catch (err) {
    mostrarAlerta(err.message);
    btn.disabled = false;
    btn.innerHTML = '<i class="bi bi-person-plus me-2"></i>Criar Conta';
  }
}

// Redireciona se já logado
if (localStorage.getItem('ob_token')) window.location.href = 'dashboard.html';
</script>
</body>
</html>
